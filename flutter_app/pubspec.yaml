name: siklab_kumpas
description: A bi-directional Filipino Sign Language translation app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0

  # Speech
  speech_to_text: ^7.0.0
  # Offline speech recognition. The device's system recognisers are all
  # unusable here: Google's is throttled, Google TTS's has no matching
  # language, and MIUI's dialog errors out. This runs on-device instead,
  # which also removes the only part of the app that left the phone.
  vosk_flutter_service: ^0.1.2
  flutter_tts: ^4.0.0

  # Permissions
  permission_handler: ^12.0.3

  # Flashlight
  torch_light: ^1.0.0

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.0.0
  tflite_flutter: ^0.12.1
  flutter_svg: ^2.3.0

  # ASL avatar clip playback
  video_player: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/labels/
    - assets/icons/
    - assets/avatar/clips/
